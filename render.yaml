services:
  - type: web
    name: zada-cashbook-ceo-server
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGINS
        value: "*"
      - key: AUTH_ENABLED
        value: "false"
      - key: DEFAULT_PHARMACY_ID
        value: zada-pharmacy
      - key: DEFAULT_BRANCH_ID
        value: main
